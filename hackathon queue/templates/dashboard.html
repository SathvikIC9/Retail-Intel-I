<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Queue Monitor
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="app">

    <header>

        <div>

            <h1>
                Smart Queue Monitor
            </h1>

            <p>
                Supermarket Checkout Intelligence
            </p>

        </div>

        <div class="live-indicator">

            <span class="dot"></span>

            FRAME MODE

        </div>

    </header>


    <main>


        <!-- ================================================= -->
        <!-- CAMERA / TRACKING VIEW                            -->
        <!-- ================================================= -->

        <section class="camera-panel">

            <div class="section-title">

                <h2>
                    Tracking View
                </h2>

                <span id="frame-number">
                    Frame 1
                </span>

            </div>


            <div class="camera-wrapper">

                <img
                    id="tracking-image"
                    src="/frame"
                    alt="Tracked supermarket frame"
                >

            </div>


            <div class="frame-controls">

                <button
                    onclick="previousFrame()"
                >
                    ← Previous
                </button>

                <button
                    onclick="nextFrame()"
                >
                    Next →
                </button>

            </div>

        </section>



        <!-- ================================================= -->
        <!-- QUEUE STATUS                                     -->
        <!-- ================================================= -->

        <section class="status-panel">

            <div class="section-title">

                <h2>
                    Queue Status
                </h2>

            </div>


            <div
                id="counter-grid"
                class="counter-grid"
            >

            </div>


            <div class="metric-box">

                <span>
                    Total Waiting
                </span>

                <strong
                    id="total-waiting"
                >
                    0
                </strong>

            </div>


            <button
                class="alert-button"
                onclick="alertManager()"
            >

                🚨 ALERT MANAGER

            </button>


            <div
                id="alert-message"
                class="alert-message"
            >

            </div>

        </section>



        <!-- ================================================= -->
        <!-- VISUALIZATION PLACEHOLDER                        -->
        <!-- ================================================= -->

        <section class="visualization-panel">

    <div class="section-title">

            <h2>
                Queue Visualization
            </h2>

            <span id="map-status">
                Spatial tracking view
            </span>

        </div>

        <div class="queue-map-wrapper">

            <canvas
                id="queue-map"
                width="1200"
                height="500"
            ></canvas>

            <div class="map-legend">

                <div>
                    <span class="legend-dot queue"></span>
                    Queue
                </div>

                <div>
                    <span class="legend-dot service"></span>
                    Service
                </div>

                <div>
                    <span class="legend-dot cashier"></span>
                    Cashier
                </div>

                <div>
                    <span class="legend-dot outside"></span>
                    Unassigned
                </div>

            </div>

        </div>

    </section>


    </main>

</div>



<script>

async function loadStatus() {

    const response = await fetch(
        "/api/status"
    );

    const data = await response.json();


    document.getElementById(
        "frame-number"
    ).innerText =
        "Frame " + data.frame_number;


    document.getElementById(
        "total-waiting"
    ).innerText =
        data.total_waiting;


    const grid = document.getElementById(
        "counter-grid"
    );

    grid.innerHTML = "";


    for (
        const [counterId, counter]
        of Object.entries(data.counters)
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "counter-card " +
            counter.state.toLowerCase();


        card.innerHTML = `

            <div class="counter-header">

                <span>
                    Counter ${counterId}
                </span>

                <span class="state">
                    ${counter.state}
                </span>

            </div>

            <div class="queue-number">

                ${counter.queue_count}

            </div>

            <div class="queue-label">
                waiting
            </div>

            <div class="counter-info">

                Cashier:
                ${
                    counter.cashier_present
                    ? "Yes"
                    : "No"
                }

                <br>

                Serving:
                ${
                    counter.customer_in_service
                    ? "Yes"
                    : "No"
                }

            </div>
        `;


        grid.appendChild(
            card
        );

    }

    drawQueueMap(data);

}


function refreshImage() {

    const image =
        document.getElementById(
            "tracking-image"
        );

    image.src =
        "/frame?t=" +
        new Date().getTime();

}


async function nextFrame() {

    await fetch(
        "/api/next",
        {
            method: "POST"
        }
    );

    await loadStatus();

    refreshImage();

}


async function previousFrame() {

    await fetch(
        "/api/previous",
        {
            method: "POST"
        }
    );

    await loadStatus();

    refreshImage();

}


async function alertManager() {

    const response =
        await fetch(
            "/api/status"
        );

    const data =
        await response.json();


    let worstCounter = null;
    let largestQueue = -1;


    for (
        const [counterId, counter]
        of Object.entries(data.counters)
    ) {

        if (
            counter.queue_count
            > largestQueue
        ) {

            largestQueue =
                counter.queue_count;

            worstCounter =
                counterId;

        }

    }


    const alertResponse =
        await fetch(
            "/api/alert",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    counter_id:
                        worstCounter
                })
            }
        );


    const result =
        await alertResponse.json();


    document.getElementById(
        "alert-message"
    ).innerText =
        result.message;

}
// ============================================================
// SPATIAL QUEUE MAP
// ============================================================

function drawQueueMap(data) {

    const canvas =
        document.getElementById("queue-map");

    const ctx =
        canvas.getContext("2d");

    const width = canvas.width;
    const height = canvas.height;

    // --------------------------------------------------------
    // CLEAR
    // --------------------------------------------------------

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    // --------------------------------------------------------
    // BACKGROUND
    // --------------------------------------------------------

    ctx.fillStyle = "#080b10";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    // --------------------------------------------------------
    // FLOOR / SPATIAL GRID
    // --------------------------------------------------------

    ctx.strokeStyle = "#252c38";
    ctx.lineWidth = 1;

    // Horizontal perspective lines
    for (
        let y = 120;
        y < height;
        y += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            60,
            y
        );

        ctx.lineTo(
            width - 60,
            y
        );

        ctx.stroke();
    }

    // Perspective lines
    for (
        let x = 100;
        x < width;
        x += 100
    ) {

        ctx.beginPath();

        ctx.moveTo(
            width / 2,
            80
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();
    }

    // --------------------------------------------------------
    // FLOOR BOUNDARY
    // --------------------------------------------------------

    ctx.strokeStyle = "#667080";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        70,
        105
    );

    ctx.lineTo(
        width - 70,
        105
    );

    ctx.lineTo(
        width - 30,
        height - 25
    );

    ctx.lineTo(
        30,
        height - 25
    );

    ctx.closePath();

    ctx.stroke();

    // --------------------------------------------------------
    // COUNTER POSITIONS
    // --------------------------------------------------------

    const counterPositions = {

        "1": {
            x: 210,
            y: 145
        },

        "2": {
            x: 470,
            y: 145
        },

        "3": {
            x: 730,
            y: 145
        },

        "4": {
            x: 990,
            y: 145
        }

    };

    // --------------------------------------------------------
    // DRAW COUNTERS
    // --------------------------------------------------------

    for (
        const [counterId, counter]
        of Object.entries(data.counters)
    ) {

        const position =
            counterPositions[counterId];

        if (!position) {
            continue;
        }

        let counterColor = "#6b7280";

        if (
            counter.state === "BUSY"
        ) {

            counterColor = "#d99b28";

        } else if (
            counter.state === "IDLE"
        ) {

            counterColor = "#29bd78";
        }

        // Counter block
        ctx.fillStyle = "#171d27";

        ctx.strokeStyle =
            counterColor;

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.roundRect(
            position.x - 75,
            position.y - 25,
            150,
            50,
            8
        );

        ctx.fill();
        ctx.stroke();

        // Counter label
        ctx.fillStyle = "#ffffff";

        ctx.font =
            "bold 16px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            `COUNTER ${counterId}`,
            position.x,
            position.y - 2
        );

        // State
        ctx.fillStyle =
            counterColor;

        ctx.font =
            "bold 11px Arial";

        ctx.fillText(
            counter.state,
            position.x,
            position.y + 16
        );

        // Queue count
        ctx.fillStyle = "#ffffff";

        ctx.font =
            "bold 13px Arial";

        ctx.fillText(
            `Queue: ${counter.queue_count}`,
            position.x,
            position.y + 75
        );
    }

    // --------------------------------------------------------
    // MAP PERSON
    // --------------------------------------------------------

    function mapX(
        x,
        imageWidth
    ) {

        return (
            60 +
            (
                x / imageWidth
            ) *
            (
                width - 120
            )
        );
    }

    function mapY(
        y,
        imageHeight
    ) {

        // Perspective transformation.
        // People further up in the camera image
        // appear further back on the map.

        const normalized =
            y / imageHeight;

        return (
            105 +
            normalized *
            330
        );
    }

    // --------------------------------------------------------
    // DRAW PEOPLE
    // --------------------------------------------------------

    for (
        const person
        of data.people
    ) {

        if (
            !person.contact_point
        ) {
            continue;
        }

        const px =
            mapX(
                person.contact_point[0],
                data.image_width
            );

        const py =
            mapY(
                person.contact_point[1],
                data.image_height
            );

        let color =
            "#9ca3af";

        if (
            person.zone_type === "QUEUE"
        ) {

            color = "#21d07a";

        } else if (
            person.zone_type === "SERVICE"
        ) {

            color = "#f5d547";

        } else if (
            person.zone_type === "CASHIER"
        ) {

            color = "#ef4444";
        }

        // Person body
        ctx.fillStyle = color;

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            9,
            0,
            Math.PI * 2
        );

        ctx.fill();

        // Person body
        ctx.beginPath();

        ctx.moveTo(
            px,
            py + 8
        );

        ctx.lineTo(
            px - 7,
            py + 25
        );

        ctx.lineTo(
            px + 7,
            py + 25
        );

        ctx.closePath();

        ctx.fill();

        // ID
        ctx.fillStyle = "#ffffff";

        ctx.font =
            "bold 11px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            `ID ${person.track_id}`,
            px,
            py - 15
        );
    }

    // --------------------------------------------------------
    // TITLE
    // --------------------------------------------------------

    ctx.fillStyle = "#8d96a5";

    ctx.font =
        "12px Arial";

    ctx.textAlign = "left";

    ctx.fillText(
        `FRAME ${data.frame_number}`,
        25,
        25
    );

    ctx.fillText(
        `${data.people.length} tracked`,
        25,
        43
    );
}

loadStatus();

</script>


</body>

</html>
