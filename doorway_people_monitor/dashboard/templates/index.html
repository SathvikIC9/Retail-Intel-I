<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Doorway People Monitor
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;

            color: #ffffff;

        }


        /* =================================================
           MAIN CONTAINER
           ================================================= */

        .container {

            width: 94%;

            max-width: 1500px;

            margin: auto;

            padding: 30px 0 50px;

        }


        /* =================================================
           HEADER
           ================================================= */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .title h1 {

            margin: 0;

            font-size: 30px;

            letter-spacing: 1px;

        }


        .title p {

            margin-top: 8px;

            color: #8f96a3;

            font-size: 14px;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #9ca3af;

            font-size: 14px;

        }


        .status-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px #22c55e;

        }


        /* =================================================
           STAT CARDS
           ================================================= */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;

        }


        .card {

            background: #181b23;

            border: 1px solid #272b35;

            border-radius: 14px;

            padding: 22px;

            min-height: 125px;

        }


        .card-title {

            color: #8f96a3;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        .card-value {

            font-size: 40px;

            font-weight: bold;

            margin-top: 15px;

        }


        .card-sub {

            margin-top: 5px;

            font-size: 12px;

            color: #6f7683;

        }


        /* =================================================
           CONTENT GRID
           ================================================= */

        .grid {

            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 20px;

        }


        .panel {

            background: #181b23;

            border: 1px solid #272b35;

            border-radius: 14px;

            padding: 22px;

        }


        .panel h2 {

            margin: 0 0 20px;

            font-size: 18px;

        }


        /* =================================================
           CHART
           ================================================= */

        .chart-wrapper {

            width: 100%;

            height: 330px;

        }


        canvas {

            width: 100% !important;

            height: 100% !important;

        }


        /* =================================================
           EVENT TABLE
           ================================================= */

        .table-wrapper {

            max-height: 330px;

            overflow-y: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th {

            text-align: left;

            color: #777f8d;

            font-size: 12px;

            padding: 10px 6px;

            border-bottom:
                1px solid #292e38;

        }


        td {

            padding: 11px 6px;

            font-size: 13px;

            border-bottom:
                1px solid #222630;

        }


        .in {

            color: #22c55e;

            font-weight: bold;

        }


        .out {

            color: #ef4444;

            font-weight: bold;

        }


        .empty {

            text-align: center;

            padding: 40px;

            color: #666e7c;

        }


        /* =================================================
           RESPONSIVE
           ================================================= */

        @media (max-width: 900px) {

            .cards {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .grid {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 550px) {

            .cards {

                grid-template-columns: 1fr;

            }


            header {

                align-items: flex-start;

                flex-direction: column;

                gap: 15px;

            }

        }

    </style>


    <!-- Chart.js -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header>

        <div class="title">

            <h1>
                Doorway People Monitor
            </h1>

            <p>
                Live occupancy and doorway activity
            </p>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            <span id="status">
                Dashboard connected
            </span>

        </div>

    </header>


    <!-- =================================================
         STAT CARDS
         ================================================= -->

    <div class="cards">


        <div class="card">

            <div class="card-title">
                People Inside
            </div>

            <div
                class="card-value"
                id="peopleInside"
            >
                0
            </div>

            <div class="card-sub">
                Current occupancy
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Total In
            </div>

            <div
                class="card-value"
                id="totalIn"
            >
                0
            </div>

            <div class="card-sub">
                People entered
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Total Out
            </div>

            <div
                class="card-value"
                id="totalOut"
            >
                0
            </div>

            <div class="card-sub">
                People exited
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Total Events
            </div>

            <div
                class="card-value"
                id="totalEvents"
            >
                0
            </div>

            <div class="card-sub">
                Recorded events
            </div>

        </div>

    </div>


    <!-- =================================================
         CHART + EVENT LOG
         ================================================= -->

    <div class="grid">


        <!-- CHART -->

        <div class="panel">

            <h2>
                IN / OUT Activity
            </h2>

            <div class="chart-wrapper">

                <canvas
                    id="activityChart"
                ></canvas>

            </div>

        </div>


        <!-- EVENT LOG -->

        <div class="panel">

            <h2>
                Recent Events
            </h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Time
                            </th>

                            <th>
                                Track
                            </th>

                            <th>
                                Direction
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="eventTable"
                    >

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>


<script>


// =========================================================
// CHART
// =========================================================

const ctx =
    document
        .getElementById(
            "activityChart"
        )
        .getContext("2d");


const activityChart =
    new Chart(
        ctx,
        {

            type: "line",

            data: {

                labels: [],

                datasets: [

                    {

                        label: "IN",

                        data: [],

                        borderWidth: 2,

                        tension: 0.3,

                        fill: false

                    },

                    {

                        label: "OUT",

                        data: [],

                        borderWidth: 2,

                        tension: 0.3,

                        fill: false

                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },

                scales: {

                    x: {

                        ticks: {

                            color: "#777f8d"

                        },

                        grid: {

                            color:
                                "rgba(255,255,255,0.05)"

                        }

                    },

                    y: {

                        beginAtZero: true,

                        ticks: {

                            color: "#777f8d",

                            precision: 0

                        },

                        grid: {

                            color:
                                "rgba(255,255,255,0.05)"

                        }

                    }

                },

                plugins: {

                    legend: {

                        labels: {

                            color: "#ffffff"

                        }

                    }

                }

            }

        }
    );


// =========================================================
// FORMAT TIME
// =========================================================

function formatTime(timestamp) {

    if (!timestamp) {

        return "-";

    }

    try {

        const date =
            new Date(timestamp);

        return date.toLocaleTimeString();

    }

    catch {

        return timestamp;

    }

}


// =========================================================
// UPDATE EVENT TABLE
// =========================================================

function updateEvents(events) {

    const table =
        document.getElementById(
            "eventTable"
        );


    table.innerHTML = "";


    if (
        !events ||
        events.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="3"
                    class="empty"
                >

                    No events yet

                </td>

            </tr>

        `;

        return;

    }


    events.forEach(event => {

        const row =
            document.createElement(
                "tr"
            );


        const direction =
            (
                event.direction ||
                ""
            ).toUpperCase();


        const directionClass =
            direction === "IN"
                ? "in"
                : "out";


        row.innerHTML = `

            <td>
                ${formatTime(event.timestamp)}
            </td>

            <td>
                T${event.track_id || "-"}
            </td>

            <td class="${directionClass}">
                ${direction}
            </td>

        `;


        table.appendChild(row);

    });

}


// =========================================================
// UPDATE CHART
// =========================================================

function updateChart(hourly) {

    const hours =
        Object.keys(hourly)
            .sort();


    const inData =
        hours.map(
            hour => hourly[hour].in
        );


    const outData =
        hours.map(
            hour => hourly[hour].out
        );


    activityChart.data.labels =
        hours;


    activityChart.data.datasets[0].data =
        inData;


    activityChart.data.datasets[1].data =
        outData;


    activityChart.update();

}


// =========================================================
// FETCH DATA
// =========================================================

async function updateDashboard() {

    try {

        const response =
            await fetch(
                "/api/data",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        // -------------------------------------------------
        // Statistics
        // -------------------------------------------------

        document
            .getElementById(
                "peopleInside"
            )
            .textContent =
                data.stats.people_inside;


        document
            .getElementById(
                "totalIn"
            )
            .textContent =
                data.stats.total_in;


        document
            .getElementById(
                "totalOut"
            )
            .textContent =
                data.stats.total_out;


        document
            .getElementById(
                "totalEvents"
            )
            .textContent =
                data.stats.total_events;


        // -------------------------------------------------
        // Events
        // -------------------------------------------------

        updateEvents(
            data.recent_events
        );


        // -------------------------------------------------
        // Chart
        // -------------------------------------------------

        updateChart(
            data.hourly
        );


        // -------------------------------------------------
        // Status
        // -------------------------------------------------

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Live • Updated just now";

    }

    catch (error) {

        console.error(error);


        document
            .getElementById(
                "status"
            )
            .textContent =
                "Dashboard disconnected";

    }

}


// =========================================================
// START
// =========================================================

updateDashboard();


// Update every second

setInterval(
    updateDashboard,
    1000
);


</script>


</body>

</html>
